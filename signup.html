<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Stars Entertainers - Sign Up</title>
    <!-- FontAwesome for Modern Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #d8edf8; color: #000; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* ==========================================
           SIGNUP HERO WRAPPER - FULL SCREEN + AUTO BG
           ========================================== */
        .signup-hero-wrapper {
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: #031429;
        }

        /* Background slides */
        .bg-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
        }
        .bg-slide.active { opacity: 1; }

        /* Dark gradient overlay */
        .signup-hero-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(3, 20, 41, 0.75) 0%, rgba(3, 20, 41, 0.92) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ==========================================
           SIGNUP WRAPPER - PERFECT CENTERING
           ========================================== */
        .signup-wrapper {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            width: 100%;
            min-height: 100%;
            margin: 0 auto;
        }

        /* ==========================================
           SIGNUP CARD - BALANCED PROPORTIONS
           ========================================== */
        .signup-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 900px;
            padding: 40px 44px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        .signup-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #0c101d, #1b5394, #00d2ff);
        }

        /* ==========================================
           FORM LOGO & HEADINGS
           ========================================== */
        .form-logo { text-align: center; margin-bottom: 16px; }
        .form-logo img { width: 210px; max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .form-heading { text-align: center; font-size: 25px; font-weight: 900; color: #0c101d; letter-spacing: 1.5px; margin-bottom: 6px; text-transform: uppercase; }
        .form-subheading { text-align: center; font-size: 13px; color: #64748b; font-weight: 500; margin-bottom: 26px; }

        /* ==========================================
           HORIZONTAL TWO-COLUMN LAYOUT
           ========================================== */
        .form-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; position: relative; }
        .form-columns::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: linear-gradient(to bottom, transparent, #e2e8f0 15%, #e2e8f0 85%, transparent); transform: translateX(-50%); }
        .form-col { display: flex; flex-direction: column; }

        /* ==========================================
           SECTION DIVIDER
           ========================================== */
        .section-divider { display: flex; align-items: center; gap: 12px; margin: 0 0 18px 0; }
        .section-divider::before, .section-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, #cbd5e1, transparent); }
        .section-divider span { font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; white-space: nowrap; }

        /* ==========================================
           FORM CONTROLS
           ========================================== */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 11px; font-weight: 800; color: #1b5394; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .form-label .required { color: #ff3366; margin-left: 2px; }
        .form-label .optional { color: #94a3b8; font-weight: 700; font-size: 9px; margin-left: 4px; letter-spacing: 0.5px; }
        .input-container { position: relative; }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; transition: color 0.3s ease; pointer-events: none; }
        .form-input { width: 100%; height: 46px; background-color: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 30px; padding: 0 16px 0 44px; font-size: 13px; color: #0c101d; outline: none; transition: all 0.3s ease; font-weight: 600; }
        .form-input::placeholder { color: #94a3b8; font-weight: 500; }
        .form-input:focus { background-color: #ffffff; border-color: #00d2ff; box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15); }
        .input-container:focus-within .input-icon { color: #1b5394; }

        /* WhatsApp icon brand color hint */
        .input-icon.wa-icon { color: #25D366; }

        /* Validation states */
        .form-input.valid { border-color: #22c55e; background-color: #f0fdf4; }
        .form-input.invalid { border-color: #ff3366; background-color: #fff1f4; }
        .validation-msg { font-size: 10px; font-weight: 700; margin-top: 5px; margin-left: 16px; display: none; }
        .validation-msg.error { color: #ff3366; display: block; }
        .validation-msg.success { color: #22c55e; display: block; }

        .toggle-password { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 11px; color: #1b5394; font-weight: 800; letter-spacing: 0.5px; padding: 4px 6px; border-radius: 6px; transition: all 0.3s ease; }
        .toggle-password:hover { background: #f1f5f9; color: #00d2ff; }

        /* ==========================================
           PASSWORD STRENGTH METER
           ========================================== */
        .password-strength { display: flex; gap: 4px; margin-top: 8px; padding: 0 4px; }
        .strength-bar { flex: 1; height: 3px; background: #e2e8f0; border-radius: 4px; transition: all 0.3s ease; }
        .strength-bar.weak { background: #ff3366; }
        .strength-bar.medium { background: #f59e0b; }
        .strength-bar.strong { background: #22c55e; }
        .strength-text { font-size: 10px; font-weight: 800; margin-top: 5px; margin-left: 16px; text-transform: uppercase; letter-spacing: 0.5px; display: none; }
        .strength-text.weak { color: #ff3366; display: block; }
        .strength-text.medium { color: #f59e0b; display: block; }
        .strength-text.strong { color: #22c55e; display: block; }

        /* ==========================================
           TERMS CHECKBOX
           ========================================== */
        .terms-check { display: flex; align-items: flex-start; gap: 12px; margin: 22px 0 18px 0; font-size: 12px; color: #64748b; font-weight: 600; line-height: 1.5; padding-top: 18px; border-top: 1px solid #f1f5f9; }
        .terms-check input { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; accent-color: #1b5394; flex-shrink: 0; }
        .terms-check a { color: #1b5394; text-decoration: none; font-weight: 800; }
        .terms-check a:hover { color: #00d2ff; text-decoration: underline; }

        /* ==========================================
           SUBMIT BUTTON
           ========================================== */
        .btn-submit { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: linear-gradient(135deg, #0c101d, #1b5394); border: none; border-radius: 30px; padding: 15px 20px; font-size: 15px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 10px 25px rgba(27, 83, 148, 0.3); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-submit::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); transition: left 0.5s ease; }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(27, 83, 148, 0.4); background: linear-gradient(135deg, #1b5394, #0c101d); }
        .btn-submit:active { transform: translateY(0); box-shadow: 0 5px 15px rgba(27, 83, 148, 0.2); }

        /* ==========================================
           ALERT BOX
           ========================================== */
        .alert-box { display: none; padding: 12px 18px; border-radius: 10px; margin-bottom: 18px; font-size: 13px; font-weight: bold; text-align: center; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* ==========================================
           LOGIN LINK
           ========================================== */
        .login-link { text-align: center; margin-top: 18px; font-size: 13px; color: #64748b; font-weight: 600; }
        .login-link a { color: #1b5394; text-decoration: none; font-weight: 800; transition: color 0.3s ease; }
        .login-link a:hover { color: #00d2ff; text-decoration: underline; }

        /* ==========================================
           RESPONSIVE - LARGE DESKTOP (1440px)
           ========================================== */
        @media (max-width: 1440px) {
            .signup-wrapper { padding: 40px 20px; }
        }

        /* ==========================================
           RESPONSIVE - DESKTOP (1280px)
           ========================================== */
        @media (max-width: 1280px) {
            .signup-wrapper { padding: 35px 20px; }
            .signup-card { max-width: 860px; padding: 38px 40px; }
        }

        /* ==========================================
           RESPONSIVE - TABLET LANDSCAPE (1024px)
           ========================================== */
        @media (max-width: 1024px) {
            .signup-wrapper { padding: 30px 20px; }
            .signup-card { max-width: 820px; padding: 35px 32px; }
            .form-columns { gap: 28px; }
        }

        /* ==========================================
           RESPONSIVE - TABLET PORTRAIT (900px)
           ========================================== */
        @media (max-width: 900px) {
            .signup-wrapper { padding: 28px 18px; }
            .signup-card { padding: 32px 28px; }
            .form-columns { gap: 24px; }
        }

        /* ==========================================
           RESPONSIVE - MOBILE (768px and below)
           ========================================== */
        @media (max-width: 768px) {
            /* Stack two columns into one */
            .form-columns { grid-template-columns: 1fr; gap: 0; }
            .form-columns::before { display: none; }

            .signup-wrapper { padding: 25px 18px; }
            .signup-card { padding: 30px 24px; border-radius: 14px; max-width: 480px; }
            .form-logo img { width: 180px; }
            .form-heading { font-size: 22px; letter-spacing: 1px; }
            .form-subheading { font-size: 12.5px; margin-bottom: 22px; }
            .form-col { margin-bottom: 4px; }

            .section-divider { margin: 6px 0 16px 0; }
            .section-divider span { font-size: 10px; }

            .form-label { font-size: 10.5px; }
            .form-input { height: 48px; font-size: 13.5px; padding: 0 16px 0 44px; }

            .btn-submit { font-size: 14px; padding: 14px 20px; letter-spacing: 1.2px; }
            .terms-check { font-size: 11.5px; }
            .login-link { font-size: 12.5px; }
        }

        /* ==========================================
           RESPONSIVE - SMALL MOBILE (480px and below)
           ========================================== */
        @media (max-width: 480px) {
            .signup-wrapper { padding: 20px 14px; }
            .signup-card { padding: 26px 18px; border-radius: 12px; max-width: 100%; }
            .form-logo { margin-bottom: 12px; }
            .form-logo img { width: 160px; }
            .form-heading { font-size: 19px; letter-spacing: 0.8px; }
            .form-subheading { font-size: 12px; margin-bottom: 18px; }

            .section-divider span { font-size: 9.5px; letter-spacing: 1.2px; }

            .form-group { margin-bottom: 14px; }
            .form-label { font-size: 10px; margin-bottom: 6px; }
            .form-input { height: 44px; font-size: 12.5px; padding: 0 14px 0 42px; }
            .input-icon { left: 14px; font-size: 13px; }
            .toggle-password { right: 12px; font-size: 10px; padding: 3px 5px; }
            .validation-msg { font-size: 9.5px; margin-left: 14px; }

            .btn-submit { font-size: 13px; padding: 13px 18px; letter-spacing: 1px; gap: 8px; }
            .terms-check { font-size: 11px; gap: 10px; margin: 18px 0 14px 0; padding-top: 14px; }
            .terms-check input { width: 16px; height: 16px; }
            .login-link { font-size: 12px; margin-top: 14px; }
        }

        /* ==========================================
           RESPONSIVE - EXTRA SMALL (375px and below)
           ========================================== */
        @media (max-width: 375px) {
            .signup-wrapper { padding: 18px 12px; }
            .signup-card { padding: 22px 14px; }
            .form-logo img { width: 140px; }
            .form-heading { font-size: 17px; }
            .form-subheading { font-size: 11.5px; }

            .form-input { height: 42px; font-size: 12px; padding: 0 12px 0 38px; }
            .input-icon { left: 12px; font-size: 12px; }
            .form-label { font-size: 9.5px; }

            .btn-submit { font-size: 12.5px; padding: 12px 16px; letter-spacing: 0.8px; }
        }

        /* ==========================================
           RESPONSIVE - TINY (320px and below)
           ========================================== */
        @media (max-width: 320px) {
            .signup-card { padding: 18px 12px; }
            .form-logo img { width: 125px; }
            .form-heading { font-size: 15.5px; }
            .form-subheading { font-size: 11px; }

            .form-input { height: 40px; font-size: 11.5px; padding: 0 12px 0 36px; }
            .input-icon { left: 11px; font-size: 11px; }
            .form-label { font-size: 9px; }

            .section-divider span { font-size: 9px; letter-spacing: 1px; }
            .btn-submit { font-size: 12px; padding: 11px 14px; letter-spacing: 0.6px; }
            .terms-check { font-size: 10px; }
        }
    </style>
    <style>
        /* Global paragraph justify without affecting UI components */
        p { text-align: justify; }
        .singer-info p { text-align: center; }
        .video-info p, .small-yt-card-info p, .specialist-text p, footer p, .hero p { text-align: left; }
    </style>
</head>

<body>

    <!-- Sign Up Area (Top Banner, Header, Footer removed) -->
    <div class="signup-hero-wrapper">

        <!-- Auto-changing background slides -->
        <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1470&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1470&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=1470&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1470&auto=format&fit=crop');"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=1470&auto=format&fit=crop');"></div>

        <!-- Main Sign Up Area -->
        <div class="signup-wrapper">
            <div class="signup-card">

                <!-- Logo Section -->
                <div class="form-logo">
                    <img src="images/logo/logo.png" alt="3STARS ENTERTAINERS">
                </div>

                <!-- Form Heading -->
                <h2 class="form-heading">Create Account</h2>
                <p class="form-subheading">Join 3Stars Entertainers and start your karaoke journey</p>

                <!-- Feedback Alert -->
                <div id="alert-msg" class="alert-box"></div>

                <!-- Sign Up Form -->
                <form id="signupForm" onsubmit="handleSignup(event)" novalidate>

                    <!-- HORIZONTAL TWO-COLUMN LAYOUT -->
                    <div class="form-columns">

                        <!-- LEFT COLUMN: Personal Information -->
                        <div class="form-col">
                            <div class="section-divider"><span>Personal Information</span></div>

                            <div class="form-group">
                                <label class="form-label" for="fullName">Full Name <span class="required">*</span></label>
                                <div class="input-container">
                                    <i class="fas fa-user input-icon"></i>
                                    <input type="text" id="fullName" class="form-input" placeholder="John Doe" required>
                                </div>
                                <div class="validation-msg" id="fullName-msg"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="email">Email Address <span class="required">*</span></label>
                                <div class="input-container">
                                    <i class="fas fa-envelope input-icon"></i>
                                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                                </div>
                                <div class="validation-msg" id="email-msg"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="whatsapp">WhatsApp Number <span class="optional">(Optional)</span></label>
                                <div class="input-container">
                                    <i class="fab fa-whatsapp input-icon wa-icon"></i>
                                    <input type="tel" id="whatsapp" class="form-input" placeholder="+94 77 123 4567">
                                </div>
                                <div class="validation-msg" id="whatsapp-msg"></div>
                            </div>

                        </div>

                        <!-- RIGHT COLUMN: Account Security -->
                        <div class="form-col">
                            <div class="section-divider"><span>Account Security</span></div>

                            <div class="form-group">
                                <label class="form-label" for="username">Username <span class="required">*</span></label>
                                <div class="input-container">
                                    <i class="fas fa-at input-icon"></i>
                                    <input type="text" id="username" class="form-input" placeholder="johndoe" required>
                                </div>
                                <div class="validation-msg" id="username-msg"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="password">Password <span class="required">*</span></label>
                                <div class="input-container">
                                    <i class="fas fa-lock input-icon"></i>
                                    <input type="password" id="password" class="form-input" placeholder="Create a strong password" required>
                                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">SHOW</button>
                                </div>
                                <div class="password-strength">
                                    <div class="strength-bar" id="bar1"></div>
                                    <div class="strength-bar" id="bar2"></div>
                                    <div class="strength-bar" id="bar3"></div>
                                    <div class="strength-bar" id="bar4"></div>
                                </div>
                                <div class="strength-text" id="strength-text"></div>
                                <div class="validation-msg" id="password-msg"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="confirmPassword">Confirm Password <span class="required">*</span></label>
                                <div class="input-container">
                                    <i class="fas fa-lock input-icon"></i>
                                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required>
                                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">SHOW</button>
                                </div>
                                <div class="validation-msg" id="confirmPassword-msg"></div>
                            </div>
                        </div>

                    </div>
                    <!-- END HORIZONTAL TWO-COLUMN LAYOUT -->

                    <!-- Terms & Conditions -->
                    <label class="terms-check">
                        <input type="checkbox" id="terms" required>
                        <span>
                            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of 3Stars Entertainers Pvt Ltd.
                        </span>
                    </label>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>

                    <!-- Login Link -->
                    <p class="login-link">
                        Already have an account? <a href="index.html">Log In</a>
                    </p>

                </form>
            </div>
        </div>
    </div>

    <!-- Authentication Client -->
    <script src="js/auth.js"></script>

    <!-- Interactive Script -->
    <script>
        /* ==========================================
           AUTO-CHANGING BACKGROUND SLIDES
           ========================================== */
        (function () {
            const slides = document.querySelectorAll('.bg-slide');
            let current = 0;

            if (slides.length > 1) {
                slides.forEach(slide => {
                    const bg = slide.style.backgroundImage.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
                    if (bg) {
                        const img = new Image();
                        img.src = bg;
                    }
                });

                setInterval(() => {
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }, 5000);
            }
        })();

        /* ==========================================
           PASSWORD VISIBILITY TOGGLE
           ========================================== */
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = 'HIDE';
            } else {
                input.type = 'password';
                btn.innerText = 'SHOW';
            }
        }

        /* ==========================================
           PASSWORD STRENGTH METER
           ========================================== */
        const passwordInput = document.getElementById('password');
        const strengthBars = [
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3'),
            document.getElementById('bar4')
        ];
        const strengthText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', function () {
            const val = this.value;
            let score = 0;

            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            strengthBars.forEach(bar => { bar.className = 'strength-bar'; });

            if (val.length === 0) {
                strengthText.className = 'strength-text';
                strengthText.innerText = '';
                return;
            }

            if (score <= 1) {
                strengthBars[0].classList.add('weak');
                strengthText.className = 'strength-text weak';
                strengthText.innerText = 'Weak Password';
            } else if (score === 2) {
                strengthBars[0].classList.add('medium');
                strengthBars[1].classList.add('medium');
                strengthText.className = 'strength-text medium';
                strengthText.innerText = 'Medium Password';
            } else if (score === 3) {
                strengthBars[0].classList.add('strong');
                strengthBars[1].classList.add('strong');
                strengthBars[2].classList.add('strong');
                strengthText.className = 'strength-text strong';
                strengthText.innerText = 'Strong Password';
            } else {
                strengthBars.forEach(bar => bar.classList.add('strong'));
                strengthText.className = 'strength-text strong';
                strengthText.innerText = 'Very Strong Password';
            }
        });

        /* ==========================================
           FIELD VALIDATION HELPERS
           ========================================== */
        function setValidation(inputId, msgId, isValid, message) {
            const input = document.getElementById(inputId);
            const msg = document.getElementById(msgId);
            if (!input || !msg) return;

            if (isValid) {
                input.classList.remove('invalid');
                input.classList.add('valid');
                msg.className = 'validation-msg success';
                msg.innerText = message || '';
            } else {
                input.classList.remove('valid');
                input.classList.add('invalid');
                msg.className = 'validation-msg error';
                msg.innerText = message || '';
            }
        }

        function clearValidation(inputId, msgId) {
            const input = document.getElementById(inputId);
            const msg = document.getElementById(msgId);
            if (input) input.classList.remove('valid', 'invalid');
            if (msg) { msg.className = 'validation-msg'; msg.innerText = ''; }
        }

        /* ==========================================
           REAL-TIME FIELD VALIDATION
           ========================================== */
        document.getElementById('fullName').addEventListener('blur', function () {
            if (this.value.trim().length >= 3) {
                setValidation('fullName', 'fullName-msg', true, 'âœ“ Looks good!');
            } else if (this.value.trim().length > 0) {
                setValidation('fullName', 'fullName-msg', false, 'Name must be at least 3 characters.');
            } else {
                clearValidation('fullName', 'fullName-msg');
            }
        });

        document.getElementById('email').addEventListener('blur', function () {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailRegex.test(this.value.trim())) {
                setValidation('email', 'email-msg', true, 'âœ“ Valid email address.');
            } else if (this.value.trim().length > 0) {
                setValidation('email', 'email-msg', false, 'Please enter a valid email address.');
            } else {
                clearValidation('email', 'email-msg');
            }
        });

        document.getElementById('whatsapp').addEventListener('blur', function () {
            const val = this.value.trim().replace(/[\s\-()]/g, '');
            if (val.length === 0) {
                clearValidation('whatsapp', 'whatsapp-msg');
                return;
            }
            const waRegex = /^\+?\d{7,15}$/;
            if (waRegex.test(val)) {
                setValidation('whatsapp', 'whatsapp-msg', true, 'âœ“ Valid WhatsApp number.');
            } else {
                setValidation('whatsapp', 'whatsapp-msg', false, 'Enter a valid number (7-15 digits, optional +).');
            }
        });

        document.getElementById('username').addEventListener('blur', function () {
            if (this.value.trim().length >= 4) {
                setValidation('username', 'username-msg', true, 'âœ“ Username available.');
            } else if (this.value.trim().length > 0) {
                setValidation('username', 'username-msg', false, 'Username must be at least 4 characters.');
            } else {
                clearValidation('username', 'username-msg');
            }
        });

        document.getElementById('confirmPassword').addEventListener('blur', function () {
            const pwd = document.getElementById('password').value;
            if (this.value.length === 0) {
                clearValidation('confirmPassword', 'confirmPassword-msg');
            } else if (this.value === pwd) {
                setValidation('confirmPassword', 'confirmPassword-msg', true, 'âœ“ Passwords match.');
            } else {
                setValidation('confirmPassword', 'confirmPassword-msg', false, 'Passwords do not match.');
            }
        });

        /* ==========================================
           SIGN UP FORM SUBMISSION
           ========================================== */
        async function handleSignup(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const submitBtn = document.querySelector('.btn-submit');

            if (!fullName || !email || !username || !password || !confirmPassword) {
                showAlert('error', 'Please fill in all required fields marked with *');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('error', 'Please enter a valid email address.');
                return;
            }

            if (whatsapp) {
                const cleanWa = whatsapp.replace(/[\s\-()]/g, '');
                const waRegex = /^\+?\d{7,15}$/;
                if (!waRegex.test(cleanWa)) {
                    showAlert('error', 'Please enter a valid WhatsApp number.');
                    return;
                }
            }

            if (username.length < 4) {
                showAlert('error', 'Username must be at least 4 characters long.');
                return;
            }

            if (password.length < 6) {
                showAlert('error', 'Password must be at least 6 characters long.');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('error', 'Passwords do not match.');
                return;
            }

            if (!terms) {
                showAlert('error', 'You must agree to the Terms of Service & Privacy Policy.');
                return;
            }

            // UI feedback while loading
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            submitBtn.disabled = true;

            const result = await window.auth.signup({
                name: fullName,
                email: email,
                whatsapp: whatsapp,
                username: username,
                password: password
            });

            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;

            if (result.success) {
                showAlert('success', 'Account created successfully! Redirecting to login...');
                document.getElementById('signupForm').reset();
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                showAlert('error', result.message || 'Failed to create account. Please try again.');
            }
        }

        function showAlert(type, message) {
            const alertMsg = document.getElementById('alert-msg');
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            alertMsg.className = 'alert-box alert-' + type;
            alertMsg.innerHTML = '<i class="fas ' + icon + '" style="margin-right:8px;"></i> ' + message;
            alertMsg.style.display = 'block';
            alertMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>

</html>
