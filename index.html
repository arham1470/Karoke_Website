<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Stars Entertainers - Login Page</title>
    <!-- FontAwesome for Modern Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #d8edf8; color: #000; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        /* ==========================================
           LOGIN HERO WRAPPER (FULL SCREEN BACKGROUND)
           ========================================== */
        .login-hero-wrapper {
            background: linear-gradient(to bottom, rgba(3, 20, 41, 0.7) 0%, rgba(3, 20, 41, 0.95) 100%), url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1470&auto=format&fit=crop') center center/cover;
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ==========================================
           LOGIN WRAPPER - PERFECT CENTERING
           ========================================== */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            width: 100%;
            min-height: 100%;
            margin: 0 auto;
        }

        /* ==========================================
           LOGIN CARD - BALANCED PROPORTIONS
           ========================================== */
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 480px;
            padding: 40px 42px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(135deg, #0c101d, #1b5394, #00d2ff);
        }

        /* Form Logo */
        .form-logo { text-align: center; margin-bottom: 25px; }
        .form-logo img { width: 220px; max-width: 100%; height: auto; display: block; margin: 0 auto; }

        /* Form Headings */
        .form-heading { text-align: center; font-size: 26px; font-weight: 900; color: #0c101d; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
        .form-subheading { text-align: center; font-size: 14px; color: #64748b; font-weight: 500; margin-bottom: 30px; }

        /* Form Controls */
        .form-group { margin-bottom: 22px; }
        .form-label { display: block; font-size: 12px; font-weight: 800; color: #1b5394; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .input-container { position: relative; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; transition: color 0.3s ease; pointer-events: none; }
        .form-input { width: 100%; height: 52px; background-color: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 30px; padding: 0 20px 0 50px; font-size: 15px; color: #0c101d; outline: none; transition: all 0.3s ease; font-weight: 600; }
        .form-input::placeholder { color: #94a3b8; font-weight: 500; }
        .form-input:focus { background-color: #ffffff; border-color: #00d2ff; box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15); }
        .input-container:focus-within .input-icon { color: #1b5394; }

        .toggle-password { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 13px; color: #1b5394; font-weight: 800; letter-spacing: 0.5px; padding: 5px 8px; border-radius: 6px; transition: all 0.3s ease; }
        .toggle-password:hover { background: #f1f5f9; color: #00d2ff; }

        /* Form Options */
        .form-options { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; margin-bottom: 30px; font-size: 13px; gap: 12px; flex-wrap: wrap; }
        .remember-me { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; color: #64748b; transition: color 0.3s ease; }
        .remember-me:hover { color: #1b5394; }
        .remember-me input { width: 18px; height: 18px; cursor: pointer; accent-color: #1b5394; border-radius: 4px; }
        .forgot-password { color: #1b5394; text-decoration: none; font-weight: 800; transition: all 0.3s ease; }
        .forgot-password:hover { color: #00d2ff; text-decoration: underline; }

        /* Submit Button */
        .btn-submit { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin: 0; background: linear-gradient(135deg, #0c101d, #1b5394); border: none; border-radius: 30px; padding: 15px 20px; font-size: 16px; font-weight: 800; color: #fff; text-align: center; text-transform: uppercase; letter-spacing: 1.5px; cursor: pointer; box-shadow: 0 10px 25px rgba(27, 83, 148, 0.3); transition: all 0.3s ease; position: relative; overflow: hidden; }
        .btn-submit::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); transition: left 0.5s ease; }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(27, 83, 148, 0.4); background: linear-gradient(135deg, #1b5394, #0c101d); }
        .btn-submit:active { transform: translateY(0); box-shadow: 0 5px 15px rgba(27, 83, 148, 0.2); }

        /* Alert Box */
        .alert-box { display: none; padding: 14px 18px; border-radius: 10px; margin-bottom: 22px; font-size: 14px; font-weight: bold; text-align: center; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Sign Up Link */
        .signup-link { text-align: center; margin-top: 24px; font-size: 14px; color: #64748b; font-weight: 600; }
        .signup-link a { color: #1b5394; text-decoration: none; font-weight: 800; transition: color 0.3s ease; }
        .signup-link a:hover { color: #00d2ff; text-decoration: underline; }

        /* ==========================================
           RESPONSIVE — LARGE DESKTOP (1440px)
           ========================================== */
        @media (max-width: 1440px) {
            .login-wrapper { padding: 40px 20px; }
        }

        /* ==========================================
           RESPONSIVE — DESKTOP (1280px)
           ========================================== */
        @media (max-width: 1280px) {
            .login-wrapper { padding: 35px 20px; }
        }

        /* ==========================================
           RESPONSIVE — TABLET LANDSCAPE (1024px)
           ========================================== */
        @media (max-width: 1024px) {
            .login-wrapper { padding: 30px 20px; }
            .login-card { max-width: 460px; padding: 35px 35px; }
            .form-logo img { width: 200px; }
        }

        /* ==========================================
           RESPONSIVE — TABLET PORTRAIT (900px)
           ========================================== */
        @media (max-width: 900px) {
            .login-wrapper { padding: 28px 18px; }
            .login-card { padding: 32px 30px; }
        }

        /* ==========================================
           RESPONSIVE — MOBILE (768px and below)
           ========================================== */
        @media (max-width: 768px) {
            .login-wrapper { padding: 25px 18px; }
            .login-card { padding: 30px 24px; border-radius: 14px; max-width: 420px; }
            .form-logo img { width: 180px; }
            .form-heading { font-size: 23px; letter-spacing: 1px; }
            .form-subheading { font-size: 13.5px; margin-bottom: 25px; }
            .form-input { height: 50px; font-size: 14px; }
            .form-label { font-size: 11.5px; }
            .btn-submit { font-size: 15px; padding: 14px 20px; letter-spacing: 1.2px; }
            .signup-link { font-size: 13.5px; }
        }

        /* ==========================================
           RESPONSIVE — SMALL MOBILE (480px and below)
           ========================================== */
        @media (max-width: 480px) {
            .login-wrapper { padding: 20px 14px; }
            .login-card { padding: 26px 18px; border-radius: 12px; max-width: 100%; }
            .form-logo img { width: 160px; margin-bottom: 5px; }
            .form-heading { font-size: 20px; letter-spacing: 0.8px; }
            .form-subheading { font-size: 12.5px; margin-bottom: 20px; }
            .form-group { margin-bottom: 18px; }
            .form-label { font-size: 11px; letter-spacing: 0.8px; margin-bottom: 8px; }
            .form-input { height: 48px; font-size: 13.5px; padding: 0 16px 0 44px; }
            .input-icon { left: 16px; font-size: 15px; }
            .toggle-password { right: 14px; font-size: 12px; padding: 4px 6px; }
            .form-options { flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 22px; }
            .remember-me, .forgot-password { font-size: 13px; }
            .btn-submit { font-size: 14px; padding: 13px 18px; letter-spacing: 1px; }
            .signup-link { font-size: 13px; margin-top: 18px; }
        }

        /* ==========================================
           RESPONSIVE — EXTRA SMALL (375px and below)
           ========================================== */
        @media (max-width: 375px) {
            .login-wrapper { padding: 18px 12px; }
            .login-card { padding: 22px 14px; }
            .form-logo img { width: 140px; }
            .form-heading { font-size: 18px; }
            .form-subheading { font-size: 12px; }
            .form-input { height: 46px; font-size: 13px; padding: 0 14px 0 42px; }
            .input-icon { left: 14px; font-size: 14px; }
            .btn-submit { font-size: 13.5px; padding: 12px 16px; }
        }

        /* ==========================================
           RESPONSIVE — TINY (320px and below)
           ========================================== */
        @media (max-width: 320px) {
            .login-card { padding: 20px 12px; }
            .form-logo img { width: 130px; }
            .form-heading { font-size: 17px; }
            .form-subheading { font-size: 12px; }
            .form-input { height: 44px; font-size: 12.5px; }
            .btn-submit { font-size: 13px; padding: 12px 14px; letter-spacing: 0.8px; }
        }
    </style>
</head>

<body>

    <!-- Login Area (Top Banner, Header, Footer removed) -->
    <div class="login-hero-wrapper">
        <div class="login-wrapper">
            <div class="login-card">

                <!-- Logo Section -->
                <div class="form-logo">
                    <img src="images/logo/logo.png" alt="3STARS ENTERTAINERS">
                </div>

                <!-- Form Heading -->
                <h2 class="form-heading">Welcome Back</h2>
                <p class="form-subheading">Sign in to continue to your account</p>

                <!-- Feedback Alert -->
                <div id="alert-msg" class="alert-box"></div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">

                    <!-- Username / Email Field -->
                    <div class="form-group">
                        <label class="form-label" for="username">Username or Email ID</label>
                        <div class="input-container">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="username" class="form-input" placeholder="Enter your username or email" required>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-container">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">SHOW</button>
                        </div>
                    </div>

                    <!-- Options -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" class="forgot-password" onclick="handleForgotPassword(event)">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-sign-in-alt"></i> Log In
                    </button>

                    <!-- Sign Up Link -->
                    <p class="signup-link">
                        Don't have an account? <a href="signup.html">Sign Up</a>
                    </p>

                </form>
            </div>
        </div>
    </div>

    <!-- Interactive Script -->
    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.innerText = 'HIDE';
            } else {
                pwdInput.type = 'password';
                toggleBtn.innerText = 'SHOW';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const alertMsg = document.getElementById('alert-msg');

            if ((username === 'admin@gmail.com' || username === 'admin') && password === 'admin123') {
                alertMsg.className = 'alert-box alert-success';
                alertMsg.innerHTML = '<i class="fas fa-check-circle" style="margin-right:8px;"></i> Welcome back, ' + username + '! Logging in...';
                alertMsg.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 1500);
            } else {
                alertMsg.className = 'alert-box alert-error';
                alertMsg.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-right:8px;"></i> Invalid username or password.';
                alertMsg.style.display = 'block';
            }
        }

        function handleForgotPassword(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const alertMsg = document.getElementById('alert-msg');

            if (username) {
                alertMsg.className = 'alert-box alert-success';
                alertMsg.innerHTML = '<i class="fas fa-envelope" style="margin-right:8px;"></i> Password reset instructions sent to ' + username;
                alertMsg.style.display = 'block';
            } else {
                alertMsg.className = 'alert-box alert-error';
                alertMsg.innerHTML = '<i class="fas fa-exclamation-circle" style="margin-right:8px;"></i> Please enter your username/email above first.';
                alertMsg.style.display = 'block';
            }
        }
    </script>
</body>

</html>
